openapi: 3.0.3

info:
  title: XA Bank Time Deposit API
  version: 1.0.0
  description: API for retrieving time deposits and updating all time deposit balances.

paths:
  /time-deposits:
    get:
      summary: Get all time deposits
      operationId: getTimeDeposits
      responses:
        '200':
          description: All time deposits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeDepositResponse'

  /time-deposits/balances:
    post:
      summary: Update balances of all time deposits
      operationId: updateTimeDepositBalances
      responses:
        '204':
          description: All time deposit balances were updated successfully

components:
  schemas:
    TimeDepositResponse:
      type: object
      required:
        - id
        - planType
        - balance
        - days
        - withdrawals
      properties:
        id:
          type: integer
          format: int32
          example: 1
        planType:
          type: string
          example: PREMIUM
        balance:
          type: number
          format: double
          example: 1050.00
        days:
          type: integer
          format: int32
          example: 60
        withdrawals:
          type: array
          items:
            $ref: '#/components/schemas/WithdrawalResponse'

    WithdrawalResponse:
      type: object
      required:
        - id
        - amount
        - date
      properties:
        id:
          type: integer
          format: int32
          example: 10
        amount:
          type: number
          format: double
          example: 100.00
        date:
          type: string
          format: date
          example: 2026-09-01