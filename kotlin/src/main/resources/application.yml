server:
  port: ${SERVER_PORT:8080}

app:
  database:
    seed:
      enabled: ${APP_DATABASE_SEED_ENABLED:false}
  time-deposit:
    update:
      batch-size: ${APP_TIME_DEPOSIT_UPDATE_BATCH_SIZE:500}
      workers: ${APP_TIME_DEPOSIT_UPDATE_WORKERS:4}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

spring:
  application:
    name: time-deposit-kata
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/time_deposit}
    username: ${DB_USERNAME:time_deposit}
    password: ${DB_PASSWORD:time_deposit}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
    open-in-view: false
