server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: time-deposit-kata
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/time_deposit}
    username: ${DB_USERNAME:time_deposit}
    password: ${DB_PASSWORD:time_deposit}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
    open-in-view: false
